name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version tag to crates.io
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Validate version tag before publishing
        if: github.event_name == 'release' || inputs.publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "tashkeel-cli") | .version')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Publishing requires the tag v$version"
            exit 1
          fi
      - run: cargo package --workspace --locked

  publish:
    needs: check
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # New crates need their initial publication before trusted publishing can be configured.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Authenticate with crates.io
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish dependencies before CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "tashkeel-cli") | .version')
          for crate in tashkeel tashkeel-cli; do
            status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
              --user-agent "tashkeel-rs release ($GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is already published" ;;
              404) cargo publish --locked --package "$crate" ;;
              *) echo "::error::Checking $crate returned HTTP $status"; exit 1 ;;
            esac
          done
