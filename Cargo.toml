[package]
name = "tashkeel-cli"
version = "0.1.0"
description = "CPU Arabic diacritization of text and DOCX documents."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "tashkeel"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
ctrlc.workspace = true
dirs.workspace = true
tashkeel = { path = "crates/tashkeel", version = "0.1.0" }
tempfile.workspace = true
usage-rs = { workspace = true, features = ["completions", "response-files"] }

[dev-dependencies]
serde_json.workspace = true
usage-rs = { workspace = true, features = ["test"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/tashkeel"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ieasybooks/tashkeel-rs"
keywords = ["arabic", "diacritization", "tashkeel", "onnx", "docx"]

[workspace.dependencies]
anyhow = "1.0.104"
ctrlc = "3.5.2"
dirs = "7.0.0"
docxml = "=0.3.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
quick-xml = "0.41.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
usage-rs = "7.1.2"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
